<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#08142c" />
    </linearGradient>
    <linearGradient id="gp-grad-a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="gold-grad-a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <radialGradient id="coil-glow-a" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow-a" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle Base (Play Store / iOS HIG Standards) -->
  <rect width="512" height="512" rx="115" fill="url(#bg-grad-a)" />
  <rect width="512" height="512" rx="115" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3" />

  <!-- Subtle background radar rings -->
  <circle cx="256" cy="256" r="195" stroke="rgba(255,255,255,0.05)" stroke-width="3" fill="none" />
  <circle cx="256" cy="256" r="135" stroke="rgba(56,189,248,0.12)" stroke-width="3" fill="none" stroke-dasharray="8 8" />

  <!-- "G" Monogram part (Left) -->
  <g filter="url(#shadow-a)">
    <path d="M 185 160 C 128 160 88 200 88 256 C 88 312 128 352 185 352 C 218 352 244 338 258 318 L 258 272 L 194 272 L 194 236 L 294 236 L 294 328 C 266 368 225 388 180 388 C 102 388 46 332 46 256 C 46 180 102 124 185 124 C 226 124 262 138 288 164 L 254 198 C 236 174 212 160 185 160 Z" fill="#ffffff" />
  </g>

  <!-- "P" & Detector Coil Fusion (Right) -->
  <g filter="url(#shadow-a)">
    <!-- P Stem -->
    <rect x="306" y="124" width="36" height="264" rx="18" fill="#ffffff" />

    <!-- Detector Search Coil as the P Loop -->
    <g transform="translate(362, 210)">
      <!-- Glow pulse -->
      <circle cx="0" cy="0" r="82" fill="url(#coil-glow-a)" />
      
      <!-- Outer Coil Ring -->
      <circle cx="0" cy="0" r="72" fill="#0f172a" stroke="url(#gp-grad-a)" stroke-width="15" />
      <!-- Inner Double-D Strut -->
      <circle cx="0" cy="0" r="33" fill="none" stroke="url(#gp-grad-a)" stroke-width="10" />
      <line x1="-72" y1="0" x2="72" y2="0" stroke="url(#gp-grad-a)" stroke-width="10" />
      
      <!-- Center Gold Target Find -->
      <circle cx="0" cy="0" r="13" fill="url(#gold-grad-a)" />
    </g>
  </g>

  <!-- Sonar pulse emitting downwards to the ground -->
  <path d="M 320 398 A 45 16 0 0 1 410 398" stroke="#38bdf8" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.8" />
  <path d="M 305 418 A 65 22 0 0 1 425 418" stroke="#38bdf8" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.4" />
</svg>
