<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="opt3-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#050b18" />
    </linearGradient>
    <linearGradient id="opt3-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="opt3-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="115" fill="url(#opt3-bg)" />

  <!-- Circular Crest Outer Frame with Golden Rim -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#opt3-gold)" stroke-width="7" />
  <circle cx="256" cy="256" r="208" fill="#0b1329" stroke="rgba(245, 158, 11, 0.25)" stroke-width="2.5" />

  <!-- Topographic Relief Curves in the shield -->
  <path d="M 65 280 Q 150 240 256 290 T 445 265" stroke="rgba(255,255,255,0.09)" stroke-width="3" fill="none" />
  <path d="M 55 330 Q 180 290 280 340 T 455 305" stroke="rgba(255,255,255,0.09)" stroke-width="3" fill="none" />
  <path d="M 60 370 Q 165 350 256 375 T 450 355" stroke="rgba(245, 158, 11, 0.25)" stroke-width="3" fill="none" />

  <!-- Target Horizon Sun -->
  <circle cx="256" cy="165" r="60" fill="url(#opt3-blue)" opacity="0.3" />
  <circle cx="256" cy="165" r="35" fill="url(#opt3-gold)" opacity="0.9" />

  <!-- Explorer Silhouette in profile -->
  <!-- Explorer Cap & Head -->
  <path d="M 185 188 C 185 174 195 164 210 164 C 225 164 235 174 235 188 C 235 198 228 204 218 208 L 243 208 C 248 208 250 211 245 216 L 218 218 C 210 228 198 228 188 218 Z" fill="#ffffff" />
  <!-- Explorer Body -->
  <path d="M 190 224 C 175 238 170 264 168 298 L 200 312 L 210 278 L 220 292 L 218 362 L 198 362 L 198 372 L 228 372 L 235 298 C 242 274 240 244 222 224 Z" fill="#f8fafc" />
  <!-- Arm holding detector -->
  <path d="M 218 240 L 268 274 L 285 268 L 238 232 Z" fill="#ffffff" />

  <!-- Detector Rod & Gold Accented Search Coil -->
  <line x1="272" y1="270" x2="362" y2="352" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round" />
  <ellipse cx="362" cy="352" rx="46" ry="18" fill="#0b1329" stroke="url(#opt3-gold)" stroke-width="8" transform="rotate(-6 362 352)" />
  <ellipse cx="362" cy="352" rx="18" ry="7" fill="url(#opt3-gold)" transform="rotate(-6 362 352)" />
  
  <!-- Radiating Gold Sonar Waves -->
  <path d="M 315 372 A 55 20 0 0 1 408 372" stroke="url(#opt3-gold)" stroke-width="5" fill="none" stroke-linecap="round" />

  <!-- Banner Ribbon "GP" -->
  <rect x="191" y="60" width="130" height="50" rx="25" fill="url(#opt3-gold)" />
  <text x="256" y="95" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="32" fill="#0f172a" letter-spacing="4">GP</text>
  <text x="256" y="445" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" fill="#f59e0b" letter-spacing="4">GEOPROSPECT</text>
</svg>
