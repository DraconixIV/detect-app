<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="coil-grad-b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="gold-grad-b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="shadow-b" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="115" fill="url(#bg-grad-b)" />
  <rect width="512" height="512" rx="115" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="3" />

  <!-- Topographic ground curves -->
  <path d="M 50 380 Q 150 340 256 375 T 460 350" stroke="rgba(255,255,255,0.12)" stroke-width="6" fill="none" />
  <path d="M 50 420 Q 180 390 310 420 T 460 400" stroke="rgba(56,189,248,0.18)" stroke-width="5" fill="none" />

  <!-- High-Tech Metal Detector Coil (Perspective View) -->
  <g transform="translate(256, 275)" filter="url(#shadow-b)">
    <!-- Sonar Radiation underneath coil -->
    <ellipse cx="0" cy="45" rx="110" ry="36" stroke="#38bdf8" stroke-width="5" fill="none" opacity="0.6" stroke-dasharray="10 10" />
    <ellipse cx="0" cy="80" rx="140" ry="46" stroke="#38bdf8" stroke-width="3.5" fill="none" opacity="0.3" />

    <!-- Main Coil Outer Frame -->
    <ellipse cx="0" cy="0" rx="150" ry="62" fill="#0b1329" stroke="url(#coil-grad-b)" stroke-width="18" />
    <!-- Inner Double-D Structure -->
    <ellipse cx="0" cy="0" rx="62" ry="26" fill="none" stroke="url(#coil-grad-b)" stroke-width="11" />
    <line x1="-150" y1="0" x2="150" y2="0" stroke="url(#coil-grad-b)" stroke-width="11" />
    <line x1="0" y1="-62" x2="0" y2="62" stroke="url(#coil-grad-b)" stroke-width="11" />

    <!-- Central Discovery Core (Gold Target) -->
    <circle cx="0" cy="0" r="18" fill="url(#gold-grad-b)" />
    <circle cx="0" cy="0" r="30" stroke="url(#gold-grad-b)" stroke-width="5" fill="none" opacity="0.6" />

    <!-- Detector Shaft (Rising Upwards) -->
    <line x1="0" y1="-25" x2="-90" y2="-165" stroke="#ffffff" stroke-width="15" stroke-linecap="round" />
    <path d="M -90 -165 L -115 -190" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" />
  </g>

  <!-- Modern GP Tag (Top Right) -->
  <text x="420" y="112" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="3">GP</text>
  <circle cx="440" cy="98" r="8" fill="#38bdf8" />
</svg>
